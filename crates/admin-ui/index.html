<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Crabbase Admin Console</title>

        <!-- Favicon / App Icon -->
        <link rel="icon" type="image/png" href="/logo.png" />
        <link rel="apple-touch-icon" href="/logo.png" />
        <link data-trunk rel="copy-file" href="assets/logo.png" />

        <!-- Premium Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Manrope:wght@200..800&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
            rel="stylesheet"
        />

        <!-- Trunk Tailwind Compiler Integration -->
        <link data-trunk rel="tailwind-css" href="src/input.css" />

        <style>
            body {
                font-family: var(
                    --font-family-body,
                    "Manrope",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif
                );
                font-optical-sizing: auto;
            }
            h1,
            h2,
            h3,
            h4,
            .font-heading {
                font-family: var(--font-family-headline, "Fraunces", serif);
            }
            code,
            pre {
                font-family: var(--font-family-code, "IBM Plex Mono", monospace);
            }
        </style>
    </head>
    <body class="text-on-surface flex flex-col h-screen overflow-hidden">
        <!-- The compiled Rust WASM binary will bind here -->
    </body>
</html>
