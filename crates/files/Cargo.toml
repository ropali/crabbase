[package]
name = "crabbase_files"
version = "0.1.0"
edition = "2024"

[dependencies]
crabbase_core = { workspace = true }
crabbase_db = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
mime_guess = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }

aws-config = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"

# For uploading files from disk / streaming
aws-smithy-types = "1"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
# Test harness runs the real migrations against a scratch schema
sqlx = { workspace = true }
