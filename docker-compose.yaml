services:
  # ============================================================================
  # PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: crabbase-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crabbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crabbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Floci - Local AWS Emulator (S3, SQS, SES, SNS, etc.)
  # ============================================================================
  floci:
    image: floci/floci:latest
    container_name: crabbase-floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      SERVICES: s3,sqs,sns,ses
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
